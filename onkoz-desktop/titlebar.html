<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="color-scheme" content="dark" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:       #0e0e15;
    --surface:  #16161f;
    --border:   #2a2a3a;
    --text:     #e0e0f0;
    --muted:    #6b6b8a;
    --accent:   #7c5cbf;
    --danger:   #ed4245;
    --hover:    rgba(255,255,255,0.06);
  }

  html, body {
    height: 36px;
    overflow: hidden;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    user-select: none;
    -webkit-app-region: drag;   /* toute la barre est draggable */
    font-family: -apple-system, 'Segoe UI', sans-serif;
  }

  .titlebar {
    display: flex;
    align-items: center;
    height: 36px;
    padding: 0 8px 0 12px;
    gap: 8px;
  }

  /* Logo + nom */
  .logo {
    display: flex;
    align-items: center;
    gap: 7px;
    flex-shrink: 0;
  }
  .logo img {
    width: 20px;
    height: 20px;
    object-fit: contain;
    border-radius: 4px;
  }
  .logo span {
    font-size: 13px;
    font-weight: 700;
    color: #a88de8;
    letter-spacing: 0.06em;
  }

  /* Titre centré */
  .title {
    flex: 1;
    text-align: center;
    font-size: 12px;
    color: var(--muted);
    pointer-events: none;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* Boutons fenêtre */
  .win-controls {
    display: flex;
    align-items: center;
    gap: 2px;
    flex-shrink: 0;
    -webkit-app-region: no-drag;
  }

  .win-btn {
    width: 34px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: none;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    border-radius: 4px;
    transition: background 0.12s, color 0.12s;
    font-size: 11px;
  }
  .win-btn:hover { background: var(--hover); color: var(--text); }
  .win-btn.close:hover { background: var(--danger); color: #fff; }

  .win-btn svg { width: 11px; height: 11px; }

  /* Bouton reload (discret) */
  .reload-btn {
    -webkit-app-region: no-drag;
    width: 26px;
    height: 26px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: none;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    border-radius: 4px;
    transition: background 0.12s, color 0.12s;
    font-size: 13px;
  }
  .reload-btn:hover { background: var(--hover); color: var(--text); }
  .reload-btn.spinning { animation: spin 0.6s linear; }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

  /* Indicateur connexion */
  .status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #3ba55c;
    flex-shrink: 0;
    transition: background 0.3s;
  }
  .status-dot.offline { background: var(--danger); animation: pulse 1.2s infinite; }
  @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.4; } }
</style>
</head>
<body>

<div class="titlebar">
  <!-- Logo -->
  <div class="logo">
    <img src="assets/icon.png" alt="ONKOZ" />
    <span>ONKOZ</span>
  </div>

  <!-- Statut connexion -->
  <div class="status-dot" id="statusDot" title="Connecté"></div>

  <!-- Titre au centre -->
  <div class="title">Voice &amp; Chat Platform</div>

  <!-- Reload -->
  <button class="reload-btn" id="reloadBtn" title="Recharger">
    <svg viewBox="0 0 16 16" fill="currentColor" width="13" height="13">
      <path d="M11.534 7h3.932a.25.25 0 0 1 .192.41l-1.966 2.36a.25.25 0 0 1-.384 0l-1.966-2.36a.25.25 0 0 1 .192-.41zm-11 2h3.932a.25.25 0 0 0 .192-.41L2.692 6.23a.25.25 0 0 0-.384 0L.342 8.59A.25.25 0 0 0 .534 9z"/>
      <path fill-rule="evenodd" d="M8 3c-1.552 0-2.94.707-3.857 1.818a.5.5 0 1 1-.771-.636A6.002 6.002 0 0 1 13.917 7H12.9A5.002 5.002 0 0 0 8 3zM3.1 9a5.002 5.002 0 0 0 8.757 2.182.5.5 0 1 1 .771.636A6.002 6.002 0 0 1 2.083 9H3.1z"/>
    </svg>
  </button>

  <!-- Boutons Windows -->
  <div class="win-controls">
    <!-- Minimiser -->
    <button class="win-btn" id="btnMin" title="Réduire">
      <svg viewBox="0 0 10 1" fill="currentColor"><rect width="10" height="1"/></svg>
    </button>
    <!-- Maximiser/Restaurer -->
    <button class="win-btn" id="btnMax" title="Agrandir">
      <svg id="iconMax" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1">
        <rect x="0.5" y="0.5" width="9" height="9"/>
      </svg>
    </button>
    <!-- Fermer -->
    <button class="win-btn close" id="btnClose" title="Fermer (réduit dans le tray)">
      <svg viewBox="0 0 10 10" fill="currentColor">
        <polygon points="10,0.7 9.3,0 5,4.3 0.7,0 0,0.7 4.3,5 0,9.3 0.7,10 5,5.7 9.3,10 10,9.3 5.7,5"/>
      </svg>
    </button>
  </div>
</div>

<script>
  const api = window.electronAPI;

  document.getElementById('btnMin').onclick   = () => api.minimize();
  document.getElementById('btnClose').onclick = () => api.close();

  // Maximiser / Restaurer
  let isMaximized = false;
  document.getElementById('btnMax').onclick = () => {
    api.maximize();
  };
  api.onWindowState(state => {
    isMaximized = state === 'maximized';
    const icon  = document.getElementById('iconMax');
    const btn   = document.getElementById('btnMax');
    if (isMaximized) {
      // Icône "restaurer" (double carré)
      btn.title = 'Restaurer';
      icon.innerHTML = `
        <rect x="2.5" y="0.5" width="7" height="7" fill="none" stroke="currentColor" stroke-width="1"/>
        <rect x="0.5" y="2.5" width="7" height="7" fill="currentColor" opacity="0.15" stroke="currentColor" stroke-width="1"/>`;
    } else {
      btn.title = 'Agrandir';
      icon.innerHTML = `<rect x="0.5" y="0.5" width="9" height="9" fill="none"/>`;
    }
  });

  // Reload avec animation
  document.getElementById('reloadBtn').onclick = function() {
    this.classList.add('spinning');
    setTimeout(() => this.classList.remove('spinning'), 600);
    api.reload();
  };
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="color-scheme" content="dark" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:      #0e0e15;
    --surface: #16161f;
    --border:  #2a2a3a;
    --text:    #e0e0f0;
    --muted:   #6b6b8a;
    --accent:  #7c5cbf;
    --success: #3ba55c;
    --warning: #faa61a;
    --danger:  #ed4245;
    --hover:   rgba(255,255,255,0.06);
  }

  html, body {
    height: 36px;
    overflow: hidden;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    user-select: none;
    -webkit-app-region: drag;
    font-family: -apple-system, 'Segoe UI', sans-serif;
  }

  .titlebar {
    display: flex;
    align-items: center;
    height: 36px;
    padding: 0 6px 0 12px;
    gap: 6px;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 7px;
    flex-shrink: 0;
  }
  .logo img { width: 20px; height: 20px; object-fit: contain; border-radius: 4px; }
  .logo span { font-size: 13px; font-weight: 700; color: #a88de8; letter-spacing: 0.06em; }

  .title {
    flex: 1;
    text-align: center;
    font-size: 12px;
    color: var(--muted);
    pointer-events: none;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* ── Bandeau mise à jour ── */
  #update-bar {
    display: none;
    align-items: center;
    gap: 7px;
    background: var(--accent);
    border-radius: 5px;
    padding: 2px 10px 2px 8px;
    font-size: 11.5px;
    font-weight: 600;
    color: #fff;
    white-space: nowrap;
    cursor: pointer;
    -webkit-app-region: no-drag;
    transition: background 0.15s;
    max-width: 260px;
    overflow: hidden;
    text-overflow: ellipsis;
    flex-shrink: 0;
  }
  #update-bar:hover { background: #6a4cad; }
  #update-bar.warning { background: var(--warning); color: #000; }
  #update-bar.warning:hover { background: #e09000; }
  #update-bar.success { background: var(--success); }
  #update-bar.success:hover { background: #2e8a4a; }
  #update-bar.error { background: var(--danger); cursor: default; }

  /* Barre de progression téléchargement */
  #dl-progress {
    display: none;
    height: 3px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
    width: 80px;
    flex-shrink: 0;
  }
  #dl-bar {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), #a88de8);
    border-radius: 2px;
    transition: width 0.3s;
    width: 0%;
  }

  /* Boutons action */
  .action-btn {
    -webkit-app-region: no-drag;
    width: 26px; height: 26px;
    display: flex; align-items: center; justify-content: center;
    border: none; background: transparent; color: var(--muted);
    cursor: pointer; border-radius: 4px;
    transition: background 0.12s, color 0.12s;
  }
  .action-btn:hover { background: var(--hover); color: var(--text); }
  .action-btn.spinning svg { animation: spin 0.6s linear; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .win-controls {
    display: flex; align-items: center; gap: 2px; flex-shrink: 0;
    -webkit-app-region: no-drag;
  }
  .win-btn {
    width: 34px; height: 28px;
    display: flex; align-items: center; justify-content: center;
    border: none; background: transparent; color: var(--muted);
    cursor: pointer; border-radius: 4px;
    transition: background 0.12s, color 0.12s;
  }
  .win-btn:hover { background: var(--hover); color: var(--text); }
  .win-btn.close:hover { background: var(--danger); color: #fff; }
</style>
</head>
<body>
<div class="titlebar">

  <!-- Logo -->
  <div class="logo">
    <img src="assets/icon.png" alt="ONKOZ" />
    <span>ONKOZ</span>
  </div>

  <!-- Titre -->
  <div class="title">Voice &amp; Chat Platform</div>

  <!-- Barre de progression téléchargement -->
  <div id="dl-progress"><div id="dl-bar"></div></div>

  <!-- Bandeau mise à jour (cliquable) -->
  <div id="update-bar" role="button" tabindex="0"></div>

  <!-- Bouton recharger -->
  <button class="action-btn" id="reloadBtn" title="Recharger">
    <svg viewBox="0 0 16 16" fill="currentColor" width="13" height="13">
      <path d="M11.534 7h3.932a.25.25 0 0 1 .192.41l-1.966 2.36a.25.25 0 0 1-.384 0l-1.966-2.36a.25.25 0 0 1 .192-.41zm-11 2h3.932a.25.25 0 0 0 .192-.41L2.692 6.23a.25.25 0 0 0-.384 0L.342 8.59A.25.25 0 0 0 .534 9z"/>
      <path fill-rule="evenodd" d="M8 3c-1.552 0-2.94.707-3.857 1.818a.5.5 0 1 1-.771-.636A6.002 6.002 0 0 1 13.917 7H12.9A5.002 5.002 0 0 0 8 3zM3.1 9a5.002 5.002 0 0 0 8.757 2.182.5.5 0 1 1 .771.636A6.002 6.002 0 0 1 2.083 9H3.1z"/>
    </svg>
  </button>

  <!-- Boutons fenêtre -->
  <div class="win-controls">
    <button class="win-btn" id="btnMin" title="Réduire">
      <svg viewBox="0 0 10 1" fill="currentColor" width="10" height="1"><rect width="10" height="1"/></svg>
    </button>
    <button class="win-btn" id="btnMax" title="Agrandir">
      <svg id="iconMax" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1" width="10" height="10">
        <rect x="0.5" y="0.5" width="9" height="9"/>
      </svg>
    </button>
    <button class="win-btn close" id="btnClose" title="Fermer">
      <svg viewBox="0 0 10 10" fill="currentColor" width="10" height="10">
        <polygon points="10,0.7 9.3,0 5,4.3 0.7,0 0,0.7 4.3,5 0,9.3 0.7,10 5,5.7 9.3,10 10,9.3 5.7,5"/>
      </svg>
    </button>
  </div>
</div>

<script>
  const api = window.electronAPI;

  // ── Contrôles fenêtre ──
  document.getElementById('btnMin').onclick   = () => api.minimize();
  document.getElementById('btnClose').onclick = () => api.close();

  let isMaximized = false;
  document.getElementById('btnMax').onclick = () => api.maximize();
  api.onWindowState(state => {
    isMaximized = state === 'maximized';
    const icon  = document.getElementById('iconMax');
    const btn   = document.getElementById('btnMax');
    if (isMaximized) {
      btn.title = 'Restaurer';
      icon.innerHTML = `
        <rect x="2.5" y="0.5" width="7" height="7" fill="none" stroke="currentColor" stroke-width="1"/>
        <rect x="0.5" y="2.5" width="7" height="7" fill="rgba(255,255,255,0.1)" stroke="currentColor" stroke-width="1"/>`;
    } else {
      btn.title = 'Agrandir';
      icon.innerHTML = `<rect x="0.5" y="0.5" width="9" height="9" fill="none"/>`;
    }
  });

  // Reload
  document.getElementById('reloadBtn').onclick = function() {
    this.classList.add('spinning');
    setTimeout(() => this.classList.remove('spinning'), 600);
    api.reload();
  };

  // ── Mises à jour ──────────────────────────────────────────────────────────
  const updateBar  = document.getElementById('update-bar');
  const dlProgress = document.getElementById('dl-progress');
  const dlBar      = document.getElementById('dl-bar');

  // État courant : null | 'available' | 'downloading' | 'ready' | 'error'
  let updateState = null;

  updateBar.addEventListener('click', () => {
    if (updateState === 'ready') {
      api.installUpdate();
    } else if (updateState === 'available' || updateState === 'downloading') {
      // déjà en cours, rien à faire
    }
  });

  api.onUpdateStatus(({ type, version, percent, message }) => {
    updateState = type;

    // Réinitialiser les classes
    updateBar.className = '';

    if (type === 'available') {
      // Téléchargement automatique démarré
      updateBar.style.display = 'flex';
      updateBar.className = 'warning';
      updateBar.textContent = `⬇ v${version} en téléchargement…`;
      dlProgress.style.display = 'flex';
      dlBar.style.width = '5%';

    } else if (type === 'downloading') {
      updateBar.style.display = 'flex';
      updateBar.className = 'warning';
      updateBar.textContent = `⬇ ${percent}%`;
      dlProgress.style.display = 'flex';
      dlBar.style.width = `${percent}%`;

    } else if (type === 'ready') {
      // Téléchargement terminé → inviter à redémarrer
      updateBar.style.display = 'flex';
      updateBar.className = 'success';
      updateBar.textContent = `✅ v${version} prête — Cliquer pour redémarrer`;
      dlProgress.style.display = 'none';
      dlBar.style.width = '100%';

    } else if (type === 'up-to-date') {
      updateBar.style.display = 'none';
      dlProgress.style.display = 'none';

    } else if (type === 'error') {
      updateBar.style.display = 'flex';
      updateBar.className = 'error';
      updateBar.textContent = `⚠ Erreur mise à jour`;
      updateBar.title = message;
      dlProgress.style.display = 'none';
      setTimeout(() => { updateBar.style.display = 'none'; }, 5000);
    }
  });
</script>
</body>
</html>

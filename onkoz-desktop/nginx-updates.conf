# ── À ajouter dans /etc/nginx/sites-available/onkoz.conf ─────────────────────
# Dans le bloc server { ... } existant, ajouter ce location :

location /updates/ {
    alias /opt/onkoz/client/updates/;
    autoindex off;

    # Headers importants pour electron-updater
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    add_header Expires "0";

    # Autoriser le téléchargement des .exe et .yml
    types {
        application/octet-stream  exe;
        text/yaml                 yml yaml;
    }
}

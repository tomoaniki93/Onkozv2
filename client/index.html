<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ONKOZ — Voice & Chat Platform</title>
  <link rel="icon" type="image/png" href="/assets/icon.png" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="bg-onkoz-bg text-onkoz-text font-sans h-screen overflow-hidden">

<!-- ══════════════════════════════════════════════════════════════════════════
     AUTH SCREEN
══════════════════════════════════════════════════════════════════════════ -->
<div id="auth-screen" class="fixed inset-0 flex items-center justify-center z-50"
     style="background:radial-gradient(ellipse at 60% 40%,#2d1f4e 0%,#1e1f22 70%)">
  <div class="bg-onkoz-surface border border-onkoz-border rounded-xl p-8 w-[360px] shadow-card flex flex-col gap-4">

    <div class="flex justify-center mb-1">
      <img src="/assets/logo.png" alt="ONKOZ" class="w-full max-w-[280px] h-auto rounded-lg" />
    </div>

    <!-- Setup admin -->
    <div id="setup-form" class="hidden flex-col gap-3">
      <h2 class="text-center font-bold text-lg">Configuration initiale</h2>
      <p class="text-center text-sm text-onkoz-text-md">Aucun administrateur trouvé.</p>
      <input id="setup-username" type="text" maxlength="20" placeholder="Pseudo admin"
             class="bg-onkoz-deep border border-onkoz-border rounded-md px-3 py-2.5 outline-none focus:border-onkoz-accent transition-colors" />
      <input id="setup-password" type="password" placeholder="Mot de passe"
             class="bg-onkoz-deep border border-onkoz-border rounded-md px-3 py-2.5 outline-none focus:border-onkoz-accent transition-colors" />
      <button id="setup-btn" class="bg-onkoz-accent hover:bg-onkoz-accent-dk text-white font-semibold py-2.5 rounded-md transition-colors">
        Créer le compte admin
      </button>
    </div>

    <!-- Onglets -->
    <div id="auth-tabs" class="flex rounded-md overflow-hidden bg-onkoz-deep">
      <button class="tab-btn flex-1 py-2 font-medium text-onkoz-text-md hover:bg-onkoz-hover transition-colors active" data-tab="login">Connexion</button>
      <button class="tab-btn flex-1 py-2 font-medium text-onkoz-text-md hover:bg-onkoz-hover transition-colors" data-tab="register">Inscription</button>
    </div>

    <!-- Login -->
    <div id="login-form" class="flex flex-col gap-3">
      <input id="login-username" type="text" maxlength="20" placeholder="Pseudo" autocomplete="username"
             class="bg-onkoz-deep border border-onkoz-border rounded-md px-3 py-2.5 outline-none focus:border-onkoz-accent transition-colors" />
      <input id="login-password" type="password" placeholder="Mot de passe" autocomplete="current-password"
             class="bg-onkoz-deep border border-onkoz-border rounded-md px-3 py-2.5 outline-none focus:border-onkoz-accent transition-colors" />
      <button id="login-btn" class="bg-onkoz-accent hover:bg-onkoz-accent-dk text-white font-semibold py-2.5 rounded-md transition-colors">Se connecter</button>
    </div>

    <!-- Register -->
    <div id="register-form" class="hidden flex-col gap-3">
      <div class="bg-onkoz-user/10 border border-onkoz-user/30 rounded-md px-3 py-2.5 text-onkoz-user text-sm">
        ⚠️ Ton pseudo est <strong>définitif</strong> et ne pourra pas être changé.
      </div>
      <input id="reg-username" type="text" maxlength="20" placeholder="Choisis ton pseudo (définitif)" autocomplete="username"
             class="bg-onkoz-deep border border-onkoz-border rounded-md px-3 py-2.5 outline-none focus:border-onkoz-accent transition-colors" />
      <input id="reg-password" type="password" placeholder="Mot de passe (min 6 caractères)" autocomplete="new-password"
             class="bg-onkoz-deep border border-onkoz-border rounded-md px-3 py-2.5 outline-none focus:border-onkoz-accent transition-colors" />
      <button id="register-btn" class="bg-onkoz-accent hover:bg-onkoz-accent-dk text-white font-semibold py-2.5 rounded-md transition-colors">Créer mon compte</button>
    </div>

    <div id="auth-error" class="hidden bg-onkoz-danger/15 border border-onkoz-danger/40 rounded-md px-3 py-2.5 text-onkoz-danger text-sm text-center"></div>
  </div>
</div>

<!-- ══════════════════════════════════════════════════════════════════════════
     APP
══════════════════════════════════════════════════════════════════════════ -->
<div id="app" class="hidden grid grid-cols-app h-screen overflow-hidden">

  <!-- ── SIDEBAR GAUCHE ─────────────────────────────────────────────────── -->
  <aside class="bg-onkoz-surface border-r border-onkoz-border flex flex-col overflow-hidden">

    <!-- Header logo -->
    <div class="flex items-center gap-2.5 px-4 h-12 border-b border-onkoz-border shrink-0">
      <img src="/assets/icon.png" alt="ONKOZ" class="w-7 h-7 object-contain rounded-sm" />
      <span class="font-bold text-onkoz-accent-lt tracking-wide text-[0.95rem]">ONKOZ</span>
    </div>

    <!-- Liste des canaux (catégories + salons + éphémères) -->
    <div id="channel-list" class="flex-1 overflow-y-auto py-2 flex flex-col gap-0"></div>

    <!-- ── Panneau vocal (style Discord, caché par défaut) ─────────────────── -->
    <div id="voice-panel" class="hidden flex-col shrink-0 mx-2 mb-1 rounded-lg overflow-hidden border border-onkoz-success/40 bg-onkoz-success/5">

      <!-- Ligne statut -->
      <div class="flex items-center gap-2 px-3 pt-2.5 pb-1">
        <span class="w-2 h-2 rounded-full bg-onkoz-success animate-pulse shrink-0"></span>
        <div class="flex-1 min-w-0">
          <p class="text-[0.72rem] font-bold text-onkoz-success leading-none">Voix connectée</p>
          <p id="voice-panel-channel" class="text-[0.7rem] text-onkoz-text-muted truncate mt-0.5"></p>
        </div>
        <!-- Bouton quitter discret -->
        <button id="voice-panel-leave" title="Déconnecter"
                class="w-6 h-6 flex items-center justify-center rounded text-onkoz-text-muted hover:text-onkoz-danger hover:bg-onkoz-danger/15 transition-colors shrink-0">
          <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" fill="currentColor" viewBox="0 0 16 16">
            <path d="M5.765 4.009A5 5 0 0 1 8 3.5c.28 0 .557.02.83.057L7.5 4.9A3.001 3.001 0 0 0 5 7.5v1.49l-1.947 1.84A6 6 0 0 1 2 7.5c0-1.46.524-2.796 1.389-3.831l-.812-.812a.5.5 0 0 1 .707-.707l.481.481zm2.171 5.683-.717.678A3 3 0 0 0 11 7.5v-.041a.5.5 0 0 1 .146-.354L12 6.251V7.5a5 5 0 0 1-4.064 4.192zM6.586 15H6a.5.5 0 0 1-.5-.5v-1a.5.5 0 0 1 .5-.5h4a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5h-.586l1.5 1H6.586L8 15H6.586z"/>
            <path d="M13.657 1.757a.5.5 0 0 1 0 .707L2.343 13.778a.5.5 0 1 1-.707-.707L12.95 1.757a.5.5 0 0 1 .707 0z"/>
          </svg>
        </button>
      </div>

      <!-- Séparateur + boutons -->
      <div class="flex items-center gap-1 px-2 pb-2.5 pt-1 border-t border-onkoz-success/20 mt-1">
        <!-- Mute -->
        <button id="voice-panel-mute" title="Couper le micro"
                class="flex-1 flex items-center justify-center gap-1.5 py-1.5 rounded-md text-onkoz-text-muted hover:bg-onkoz-hover hover:text-onkoz-text transition-colors text-sm font-medium">
          <span id="voice-panel-mute-icon">🎤</span>
        </button>

        <!-- Partage écran -->
        <button id="voice-panel-screenshare" title="Partager l'écran"
                class="flex-1 flex items-center justify-center gap-1.5 py-1.5 rounded-md text-onkoz-text-muted hover:bg-onkoz-hover hover:text-onkoz-text transition-colors text-sm">
          <span id="voice-panel-screen-icon">🖥️</span>
        </button>

        <!-- Déconnexion (rouge) -->
        <button id="voice-panel-leave2" title="Quitter le vocal"
                class="flex-1 flex items-center justify-center gap-1.5 py-1.5 rounded-md text-onkoz-danger hover:bg-onkoz-danger/20 transition-colors text-sm font-medium">
          <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" fill="currentColor" viewBox="0 0 16 16">
            <path d="M3.112 5.112a3 3 0 0 0-.17.613C2.028 6.588 2 7.exclusive 2 8s.028 1.412.942 2.275l1.131-1.132A3.5 3.5 0 0 1 3.5 8c0-.484.099-.943.273-1.36L3.112 5.112zm3.776.72a3 3 0 1 0 2.224 0 3 3 0 0 0-2.224 0zm-1.16-4.047A6 6 0 0 1 8 1.5a6 6 0 0 1 4.27 10.237l-.764-.764A5 5 0 0 0 8 2.5a5 5 0 0 0-3.506 8.473l-.765.764A6 6 0 0 1 3.728 1.785zM8 9.5a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3z"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Footer user -->
    <div class="border-t border-onkoz-border p-2 shrink-0">
      <div class="flex flex-col gap-1 px-2 py-1.5 rounded-md hover:bg-onkoz-hover transition-colors cursor-default">
        <!-- Ligne 1 : avatar + nom + rôle -->
        <div class="flex items-center gap-2">
          <div id="footer-avatar" class="w-8 h-8 rounded-full flex items-center justify-center font-bold text-sm text-white shrink-0 uppercase">?</div>
          <div class="flex-1 min-w-0">
            <span id="footer-username" class="block text-sm font-semibold truncate"></span>
            <span id="footer-role" class="role-badge"></span>
          </div>
        </div>
        <!-- Ligne 2 : boutons -->
        <div class="flex items-center gap-1 pl-10">
          <button id="btn-profile-settings" title="Mon profil"
                  class="w-7 h-7 flex items-center justify-center rounded text-onkoz-text-muted hover:bg-onkoz-hover hover:text-onkoz-text transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" fill="currentColor" viewBox="0 0 16 16">
              <path d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6zm2-3a2 2 0 1 1-4 0 2 2 0 0 1 4 0zm4 8c0 1-1 1-1 1H3s-1 0-1-1 1-4 6-4 6 3 6 4zm-1-.004c-.001-.246-.154-.986-.832-1.664C11.516 10.68 10.029 10 8 10c-2.03 0-3.516.68-4.168 1.332-.678.678-.83 1.418-.832 1.664h10z"/>
            </svg>
          </button>
          <button id="btn-audio-settings" title="Paramètres audio"
                  class="w-7 h-7 flex items-center justify-center rounded text-onkoz-text-muted hover:bg-onkoz-hover hover:text-onkoz-text transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" fill="currentColor" viewBox="0 0 16 16">
              <path d="M11.5 2a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zM9.05 3a2.5 2.5 0 0 1 4.9 0H16v1h-2.05a2.5 2.5 0 0 1-4.9 0H0V3h9.05zM4.5 7a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zM2.05 8a2.5 2.5 0 0 1 4.9 0H16v1H6.95a2.5 2.5 0 0 1-4.9 0H0V8h2.05zm9.45 4a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zm-2.45 1a2.5 2.5 0 0 1 4.9 0H16v1h-2.05a2.5 2.5 0 0 1-4.9 0H0v-1h9.05z"/>
            </svg>
          </button>
          <button id="logout-btn" title="Se déconnecter"
                  class="w-7 h-7 flex items-center justify-center rounded text-onkoz-text-muted hover:bg-onkoz-hover hover:text-onkoz-text transition-colors text-sm">⏏</button>
        </div>
      </div>
    </div>
  </aside>

  <!-- ── ZONE CENTRALE ──────────────────────────────────────────────────── -->
  <main class="flex flex-col overflow-hidden bg-onkoz-bg">

    <!-- Header canal -->
    <div class="flex items-center gap-2 px-4 h-12 border-b border-onkoz-border shrink-0">
      <span id="channel-icon" class="text-onkoz-text-muted text-lg">#</span>
      <span id="channel-name" class="font-bold text-[1rem]">Sélectionne un salon</span>
      <span id="channel-category" class="text-[0.72rem] text-onkoz-text-muted ml-1"></span>
    </div>

    <!-- Contenu messages -->
    <div id="content-area" class="flex-1 overflow-y-auto p-4 flex flex-col gap-px">
      <div class="flex flex-col items-center justify-center flex-1 gap-3 text-onkoz-text-muted">
        <div class="text-6xl">🎤</div>
        <h2 class="text-onkoz-text-md text-xl font-semibold">Bienvenue sur ONKOZ</h2>
        <p class="text-sm">Sélectionne un salon pour commencer</p>
      </div>
    </div>

    <!-- Input message -->
    <div id="message-input-area" class="px-4 py-3 border-t border-onkoz-border shrink-0" style="display:none">
      <div class="flex items-center gap-2 bg-onkoz-surface border border-onkoz-border rounded-md px-3 py-1.5">
        <input id="message-input" type="text" maxlength="2000" placeholder="Message..."
               class="flex-1 bg-transparent border-none outline-none text-onkoz-text placeholder:text-onkoz-text-muted text-sm" />
        <button id="send-btn" class="w-8 h-8 flex items-center justify-center bg-onkoz-accent hover:bg-onkoz-accent-dk text-white rounded-full transition-colors text-base shrink-0">↑</button>
      </div>
    </div>
  </main>

  <!-- ── SIDEBAR DROITE (membres) ───────────────────────────────────────── -->
  <aside class="bg-onkoz-surface border-l border-onkoz-border overflow-y-auto py-3">
    <div class="text-[0.7rem] font-bold tracking-widest uppercase text-onkoz-text-muted px-4 pb-2 border-b border-onkoz-border mb-2">Membres</div>
    <div>
      <div class="text-[0.68rem] font-bold tracking-wide uppercase text-onkoz-text-muted px-4 py-2">En ligne</div>
      <ul id="online-users" class="px-2"></ul>
    </div>
    <div class="mt-2">
      <div class="text-[0.68rem] font-bold tracking-wide uppercase text-onkoz-text-muted px-4 py-2">Hors ligne</div>
      <ul id="offline-users" class="px-2"></ul>
    </div>
  </aside>
</div>

<!-- ── DM PANEL ──────────────────────────────────────────────────────────── -->
<div id="dm-panel" class="hidden fixed bottom-4 right-60 w-[340px] h-[440px] bg-onkoz-surface border border-onkoz-border rounded-xl shadow-dm flex flex-col z-50">
  <div class="flex items-center justify-between px-4 py-3 border-b border-onkoz-border text-sm shrink-0">
    <span class="text-onkoz-text-md">Message privé avec <strong id="dm-partner-name" class="text-onkoz-text font-semibold"></strong></span>
    <button id="close-dm" class="w-7 h-7 flex items-center justify-center rounded text-onkoz-text-muted hover:bg-onkoz-hover hover:text-onkoz-text transition-colors text-sm">✕</button>
  </div>
  <div id="dm-messages" class="flex-1 overflow-y-auto p-3 flex flex-col gap-1.5"></div>
  <div class="flex gap-2 p-2.5 border-t border-onkoz-border shrink-0">
    <input id="dm-input" type="text" maxlength="2000" placeholder="Message privé..."
           class="flex-1 bg-onkoz-deep border border-onkoz-border rounded-md px-3 py-2 text-sm outline-none focus:border-onkoz-accent transition-colors" />
    <button id="dm-send-btn" class="w-8 h-8 flex items-center justify-center bg-onkoz-accent hover:bg-onkoz-accent-dk text-white rounded-full transition-colors shrink-0">↑</button>
  </div>
</div>

<!-- ── MODAL Salon / Catégorie ───────────────────────────────────────────── -->
<div id="modal-overlay" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-[200]">
  <div class="bg-onkoz-surface border border-onkoz-border rounded-xl p-6 w-80 flex flex-col gap-4 shadow-dm">
    <h3 id="modal-title" class="font-bold text-lg text-onkoz-text"></h3>
    <input id="modal-channel-name" type="text" maxlength="32" placeholder="Nom..."
           class="bg-onkoz-deep border border-onkoz-border rounded-md px-3 py-2.5 outline-none focus:border-onkoz-accent transition-colors" />

    <!-- Type salon -->
    <div id="modal-type-opts" class="hidden flex gap-2">
      <button class="type-btn flex-1 py-2 rounded-md border text-sm font-medium transition-colors" data-type="text"
              class="border-onkoz-border text-onkoz-text-md hover:bg-onkoz-hover"># Texte</button>
      <button class="type-btn flex-1 py-2 rounded-md border text-sm font-medium transition-colors" data-type="voice"
              class="border-onkoz-border text-onkoz-text-md hover:bg-onkoz-hover">🔊 Vocal</button>
    </div>

    <!-- Catégorie cible -->
    <div id="modal-category-opts" class="hidden flex-col gap-1.5">
      <label class="text-[0.72rem] font-bold uppercase tracking-wider text-onkoz-text-muted">Catégorie</label>
      <select id="modal-category-select"
              class="bg-onkoz-deep border border-onkoz-border rounded-md px-2.5 py-2 text-sm outline-none focus:border-onkoz-accent transition-colors cursor-pointer">
        <option value="">— Aucune catégorie —</option>
      </select>
    </div>

    <!-- Éphémère texte -->
    <div id="modal-ephemeral-opts" class="hidden">
      <label class="flex items-center gap-2 text-sm text-onkoz-text-md cursor-pointer">
        <input id="eph-with-text" type="checkbox" class="accent-onkoz-accent" />
        Ajouter un salon texte éphémère
      </label>
    </div>

    <div class="flex gap-2 justify-end">
      <button id="modal-cancel" class="px-4 py-2 rounded-md border border-onkoz-border text-onkoz-text-md hover:bg-onkoz-hover transition-colors text-sm font-medium">Annuler</button>
      <button id="modal-confirm" class="px-4 py-2 rounded-md bg-onkoz-accent hover:bg-onkoz-accent-dk text-white font-semibold text-sm transition-colors">Créer</button>
    </div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/js/mediasoup-client.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/ui.js"></script>
<script src="/js/voice.js"></script>
<script src="/js/chat.js"></script>
<script src="/js/profile.js"></script>
<script src="/js/emoji-picker.js"></script>
<script src="/js/noise-reducer.js"></script>
<script src="/js/audio-settings.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
